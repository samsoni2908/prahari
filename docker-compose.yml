services:
  postgres:
    image: postgres:16-alpine
    container_name: prahari_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prahari}
      POSTGRES_USER: ${POSTGRES_USER:-prahari_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prahari_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prahari_app} -d ${POSTGRES_DB:-prahari}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prahari_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - PROJECT_NAME=${PROJECT_NAME:-SWASTI}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-prahari}
      - POSTGRES_USER=${POSTGRES_USER:-prahari_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-prahari_dev_password}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-prahari_app}:${POSTGRES_PASSWORD:-prahari_dev_password}@postgres:5432/${POSTGRES_DB:-prahari}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-prahari_app}:${POSTGRES_PASSWORD:-prahari_dev_password}@postgres:5432/${POSTGRES_DB:-prahari}
      - SECRET_KEY=${SECRET_KEY:-prahari-dev-secret-key-change-in-production-min32chars-sih26186}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - AGGREGATION_FLOOR=${AGGREGATION_FLOOR:-5}
      - SYNTHETIC_DATA_SEED=${SYNTHETIC_DATA_SEED:-26186}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
      - ./database:/database
      - ./data:/data:ro


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
        - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    container_name: prahari_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
    name: prahari_postgres_data
