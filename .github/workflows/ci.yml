name: PRAHARI CI

on:
  push:
    branches: [main, "deploy/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Full PostgreSQL Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: prahari-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: prahari-ci-test-secret-not-for-deployment-26186
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://postgres:prahari-ci-only@127.0.0.1:5432/prahari_test_isolated
      DATABASE_URL_SYNC: postgresql://postgres:prahari-ci-only@127.0.0.1:5432/prahari_test_isolated
      PRAHARI_TEST_DATABASE_URL: postgresql+asyncpg://postgres:prahari-ci-only@127.0.0.1:5432/prahari_test_isolated
      PRAHARI_TEST_ADMIN_URL: postgresql://postgres:prahari-ci-only@127.0.0.1:5432/postgres
      PRAHARI_ALLOW_TEST_DB_RESET: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock

      - name: Verify Python Code Compilation
        run: |
          cd backend
          python -m compileall app tools tests

      - name: Validate synthetic seed inventory
        run: |
          cd backend
          python -m tools.data_generation.seed_manifest

      - name: Prepare isolated PostgreSQL databases
        run: |
          cd backend
          python -m tools.data_generation.prepare_test_databases

      - name: Verify authoritative migration head
        run: |
          cd backend
          test "$(alembic heads | awk '{print $1}')" = "f26186_stage4_planning_sources"

      - name: Run complete backend suite
        run: |
          cd backend
          python -m pytest -q

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck & Build
        run: |
          cd frontend
          npm run lint
          npm run typecheck
          npm run build

  gitleaks:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
